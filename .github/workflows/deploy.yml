# Publica os três sites (produção, teste e em-breve) a cada push na main
# (decisão de 23/10/2026). Os testes rodam antes: se algum falhar, nada é
# publicado e os sites continuam na versão anterior.
# - O token da Cloudflare só publica Workers (modelo "Edit Cloudflare Workers").
# - As variáveis PUBLIC_* da produção são públicas por natureza (vão para o
#   navegador) e ficam em Variables do GitHub. Os segredos do site (service_role,
#   token do cache, Turnstile) já estão no próprio Worker, não passam por aqui.
# - Ficam no .env.local, como no computador: assim o .env.teste e o .env.embreve
#   continuam valendo mais e os sites teste e em-breve não recebem o banco real.
# O repositório é público: nenhum passo pode imprimir segredo.
# Depois da abertura, a regra geral é publicar primeiro na homologação; este
# workflow passa a ser revisto (ver memória do projeto), sem aprovação obrigatória.
name: Publicar os sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Variáveis públicas da produção
        working-directory: apps/web
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$PUBLIC_SUPABASE_URL" && test -n "$PUBLIC_SUPABASE_ANON_KEY" && test -n "$PUBLIC_TURNSTILE_SITE_KEY" \
            || { echo "Faltam as Variables PUBLIC_* no GitHub (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          {
            echo "PUBLIC_SUPABASE_URL=$PUBLIC_SUPABASE_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$PUBLIC_SUPABASE_ANON_KEY"
            echo "PUBLIC_TURNSTILE_SITE_KEY=$PUBLIC_TURNSTILE_SITE_KEY"
          } > .env.local

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:todos -w web
