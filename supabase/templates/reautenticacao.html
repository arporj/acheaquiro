<!doctype html>
<html lang="pt-BR">

    <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden">
      <div style="background:#1747c9;padding:18px 24px;font-size:24px;font-weight:bold;color:#ffffff">

      </div>
      <div style="padding:24px;font-size:16px;line-height:1.5">
        <h1 style="margin:0 0 12px;font-size:22px;color:#0a2266">Código de confirmação</h1>
        <p>Digite o código abaixo no Ache Aqui RO para confirmar que é você:</p>
        <p style="margin:24px 0;font-size:32px;font-weight:bold;letter-spacing:6px;color:#1747c9">{{ .Token }}</p>
        <p>Se você não pediu este código, troque a sua senha.</p>
      </div>
      <div style="padding:16px 24px;background:#f4f7fd;font-size:12px;color:#64748b">
        Este e-mail foi enviado automaticamente pelo Ache Aqui RO, de Rio das Ostras. Não responda: esta caixa não é lida.
      </div>
    </div>
